name: CI

# Direct pushes to main are the normal delivery path. CI validates every such
# push; pull-request runs remain available for exceptional collaboration.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: uc02_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uc02_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Migration consistency
        run: npm run db:check

      - name: Type-check
        run: npm run typecheck

      # Hermetic: no network, no third-party credentials. The live staging
      # suite is a separate, explicit command (see the next step).
      - name: Test (hermetic unit + disposable database suites)
        run: npm run test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/uc02_test

      # F-03: the staging anon configuration lives in repository variables, not
      # in workflow source. Anon keys are public by design (RLS protects the
      # data, not the key), but environment-specific values do not belong in a
      # file that is reviewed as code and forked by anyone.
      - name: Verify staging integration configuration
        run: |
          if [ -z "${{ vars.STAGING_SUPABASE_URL }}" ] || [ -z "${{ vars.STAGING_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::STAGING_SUPABASE_URL and STAGING_SUPABASE_ANON_KEY must be set as repository variables (Settings > Secrets and variables > Actions > Variables) before the staging integration suite can run."
            exit 1
          fi

      - name: Integration tests (live staging RLS — see docs/adr/0006)
        run: npm run test:integration
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build step doesn't fail on missing env vars.
          # Real secrets are only needed at runtime, not at build time, for
          # this project.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          APP_RUNTIME_DATABASE_URL: postgres://app_runtime:placeholder@127.0.0.1:5432/uc02_test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

  commitlint:
    name: Check commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate pushed commits
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
          fi

      - name: Validate pull-request commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

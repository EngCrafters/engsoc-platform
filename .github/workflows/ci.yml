name: CI

# Direct pushes to main are the normal delivery path. CI validates every such
# push; pull-request runs remain available for exceptional collaboration.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: uc02_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uc02_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Migration consistency
        run: npm run db:check

      - name: Type-check
        run: npm run typecheck

      - name: Test (staging RLS — see docs/adr/0006)
        run: npm run test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/uc02_test
          # Public by design (the anon key, protected by RLS, not secrecy)
          # — same reasoning as the NEXT_PUBLIC_* values below.
          STAGING_SUPABASE_URL: https://wnrdgnmmcdedmilnzzsl.supabase.co
          STAGING_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InducmRnbm1tY2RlZG1pbG56enNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMTMzMDksImV4cCI6MjEwNDg4OTMwOX0.RShOwe-amyW6vsR-clcgBmhhYChXpsx_qJZw80UOZJ8

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build step doesn't fail on missing env vars.
          # Real secrets are only needed at runtime, not at build time, for
          # this project.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          APP_RUNTIME_DATABASE_URL: postgres://app_runtime:placeholder@127.0.0.1:5432/uc02_test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

  commitlint:
    name: Check commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate pushed commits
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
          fi

      - name: Validate pull-request commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

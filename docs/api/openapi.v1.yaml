openapi: 3.1.0
info:
  title: ESSQU Core Public API
  version: "1.0.0"
  summary: Versioned read and registration contract for the Engineering Society platform.
  description: |
    This document is the authoritative external contract for the Core API.
    The landing site is expected to build against it without reading Core source.

    Versioning is in the path (`/v1`). Within v1 no field is removed, no type
    changes, no error code changes meaning, and no required field becomes
    optional. A breaking change means `/v2`.
servers:
  - url: https://engsoc-platform.vercel.app/v1
    description: Current pre-domain production
  - url: https://api.essqu.com/v1
    description: Planned custom domain, deferred
  - url: http://127.0.0.1:3000/v1
    description: Local development
tags:
  - name: Events
    description: Published event reads for trusted servers.
  - name: Registration
    description: Anonymous registration and explicit waitlist requests.
  - name: Membership
    description: Society membership applications with SQU ID verification (ADR 0017).
paths:
  /events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: List published events
      description: |
        Requires a bearer API client credential with the `events:read` scope.
        Server-to-server only; this key must never reach a browser.
      security:
        - clientKey: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [upcoming, past]
            default: upcoming
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from `meta.nextCursor`. Never construct one.
          schema:
            type: string
      responses:
        "200":
          description: A page of events
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              description: Public, short-lived. Safe to cache by a shared cache.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /events/{eventId}:
    get:
      operationId: getEvent
      tags: [Events]
      summary: Get one published event
      description: |
        A draft, archived or nonexistent event all return the same 404. The API
        never confirms that a non-public event exists.
      security:
        - clientKey: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The event
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /events/{eventId}/registrations:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: registerForEvent
      security: []
      tags: [Registration]
      summary: Register for an event
      description: |
        Public endpoint. No API key, no cookie, no credentials of any kind.

        The browser posts directly from the landing site to this origin; CORS is
        restricted to exact allowed origins. Allowed-origin responses expose
        X-Request-Id and Retry-After to browser JavaScript. The canonical registration rules —
        capacity, waitlist ordering, duplicate prevention, registration-open
        state and the per-IP rate limit — are enforced by Core, not by the
        caller.

        Send no more than one request per submission. Do not retry
        automatically: a duplicate is a conflict, not an idempotent no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attendeeName, attendeeEmail]
              properties:
                attendeeName:
                  type: string
                  minLength: 1
                  maxLength: 200
                attendeeEmail:
                  type: string
                  format: email
                  maxLength: 254
                attendeePhone:
                  type: string
                  maxLength: 32
                  description: International phone; required when the event sets phoneRequired.
                intent:
                  type: string
                  enum: [register, join_waitlist]
                  default: register
      responses:
        "201":
          description: Registration accepted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [confirmed, waitlisted]
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A conflicting state: already registered, already waitlisted, event
            full, registration closed, or registration is available instead of
            waitlist joining. The optional reason provides a stable public
            distinction; code remains conflict. Older deployments may omit reason.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413":
          description: Body exceeded 16 KiB.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          description: Content-Type was not application/json.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: A field was missing, mistyped, or an unexpected field was sent.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    options:
      operationId: registrationPreflight
      security: []
      tags: [Registration]
      summary: CORS preflight
      description: |
        Returns 204. An allowed origin receives the access-control headers; any
        other origin receives only `Vary: Origin`, which makes the browser block
        the real request.
      responses:
        "204":
          description: Preflight response
  /membership-applications:
    post:
      tags: [Membership]
      summary: Apply for society membership
      description: |
        Public endpoint, like registration: no API key, no cookie. CORS is
        restricted to exact allowed origins and Core rate-limits each client
        address (five submissions an hour).

        The application is stored as `pending_review`, or as `approved` at
        once under the `automatic` approval policy (ADR 0029, migration 0037);
        the member record still waits for the applicant's confirmed sign-in.
        Since ADR 0025
        (migration 0033) it carries no student ID and no file: the category
        decides which details apply (see GET /membership-options), and Core
        drops any field the category does not collect. No field can set a
        status, role, committee or reviewer.

        For one release Core also accepts the previous website's form (no
        `category`, with `universityId` and `idDocument`): it is treated as a
        University Student at SQU, and the student ID and file are discarded. Society Affairs and Senior
        Management review it in the Core dashboard; an approved applicant is
        invited by email to set a password.

        `statusToken` is returned once and is the only way to read the
        application's status. Core stores only its SHA-256 hash.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                [fullName, email, category, discipline, consent, consentVersion]
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200 }
                email:
                  type: string
                  maxLength: 254
                  description: Any valid address, personal or institutional.
                category:
                  type: string
                  description: |
                    A category id from GET /membership-options:
                    university_student, graduate, academic,
                    industry_professional or other.
                institution:
                  type: string
                  description: |
                    Required for university_student, optional for graduate,
                    ignored otherwise. A listed institution id, or "other" with
                    institutionName.
                institutionName:
                  type: string
                  minLength: 2
                  maxLength: 120
                  description: The university's name when institution is "other".
                academicYear:
                  type: string
                  enum: ["1", "2", "3", "4", "5"]
                  description: Required for university_student only.
                discipline:
                  type: string
                  enum:
                    [
                      mechanical,
                      electrical,
                      civil,
                      petroleum,
                      chemical,
                      mechatronics,
                      industrial,
                    ]
                interests:
                  type: array
                  maxItems: 4
                  description: Repeat the field once per interest.
                  items:
                    type: string
                    enum:
                      [
                        cad,
                        simulation,
                        embedded,
                        robotics,
                        structures,
                        process,
                        data,
                        programming,
                        power,
                        reservoir,
                        quality,
                        management,
                        sustainability,
                        hse,
                      ]
                consent: { type: string, enum: ["true"] }
                consentVersion:
                  type: string
                  enum: ["2026-11-v2", "2026-10-v1"]
                  description: 2026-11-v2 is current; 2026-10-v1 is the previous website's.
      responses:
        "201":
          description: Application stored as pending review
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, statusToken]
                    properties:
                      status: { type: string, enum: [pending_review, approved] }
                      accountActivation:
                        type: string
                        enum: [email_confirmation, immediate]
                        description: |
                          Since migration 0038 (ADR 0030). `immediate`: ask
                          POST /membership-applications/account for the
                          account instead of using Supabase sign-up.
                      statusToken:
                        { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The same email already has an open or approved application (`reason` already-applied) or a membership (`reason` already-member).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413":
          description: Body exceeded 4.5 MB.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          description: Content-Type was not multipart/form-data.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |
            `errors[]` names each field: `code` is `required`, `invalid`,
            `too-long` or `unexpected-field`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    options:
      tags: [Membership]
      summary: CORS preflight
      responses:
        "204":
          description: Preflight response
  /membership-applications/account:
    post:
      tags: [Membership]
      summary: Immediate account activation (ADR 0030)
      description: |
        For an application submitted under immediate account activation:
        Core creates the registrant's account with the Supabase Auth Admin
        API (no confirmation email, no password), links it, writes the member
        record if the application is approved, and returns a one-time
        magic-link token hash. The browser signs in with it and sets its
        password with Supabase Auth. Only the status token identifies the
        application; the email comes from the database. An address that
        already has an account is never signed in to.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statusToken]
              properties:
                statusToken: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      responses:
        "201":
          description: Account ready; sign in with the token.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [tokenHash, member]
                    properties:
                      tokenHash: { type: string }
                      member: { type: boolean }
        "404": { description: Unknown status token. }
        "409":
          description: |
            reason confirmation-required, account-exists, already-set-up or
            expired.
        "422": { description: Malformed body. }
        "503":
          description: |
            Unavailable; reason not-configured when this server cannot create
            accounts (use email confirmation).
  /membership-applications/status:
    post:
      tags: [Membership]
      summary: The applicant's own application status
      description: |
        The token travels in the body, never in a URL. The answer contains a
        status and dates only. `pending_review` covers every stage before the
        final decision; `activated` is true once the member account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statusToken]
              properties:
                statusToken: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, submittedAt, decidedAt, activated]
                    properties:
                      status:
                        {
                          type: string,
                          enum: [pending_review, approved, rejected],
                        }
                      submittedAt: { type: string, format: date-time }
                      decidedAt: { type: [string, "null"], format: date-time }
                      activated: { type: boolean }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Malformed token or unexpected field.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          $ref: "#/components/responses/Unavailable"
    options:
      tags: [Membership]
      summary: CORS preflight
      responses:
        "204":
          description: Preflight response
  /membership-options:
    get:
      tags: [Membership]
      operationId: getMembershipOptions
      summary: The membership form's categories and institutions (ADR 0025)
      description: |
        Public reference data from the database: the active categories with
        whether each asks for an institution (required, optional or none) and
        an academic year, the listed institutions, and the current consent
        version. No key; exact-origin CORS; cached for five minutes.
      responses:
        "200":
          description: Active categories and institutions, in display order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [categories, institutions, consentVersion]
                    properties:
                      categories:
                        type: array
                        items:
                          type: object
                          required: [id, label, institution, academicYear]
                          properties:
                            id: { type: string }
                            label: { $ref: "#/components/schemas/Localized" }
                            institution:
                              { type: string, enum: [required, optional, none] }
                            academicYear: { type: boolean }
                      institutions:
                        type: array
                        items:
                          type: object
                          required: [id, name, country]
                          properties:
                            id: { type: string }
                            name: { $ref: "#/components/schemas/Localized" }
                            country: { type: string, pattern: "^[A-Z]{2}$" }
                      consentVersion: { type: string }
                      approval:
                        type: string
                        enum: [automatic, review]
                        description: |
                          Since migration 0037. `automatic`: a valid
                          registration is approved at once (ADR 0029).
                          For the form's wording only.
                      accountActivation:
                        type: string
                        enum: [email_confirmation, immediate]
                        description: |
                          Since migration 0038 (ADR 0030). Wording only; the
                          submission reports the mode it recorded.
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    options:
      tags: [Membership]
      summary: CORS preflight
      responses:
        "204":
          description: Preflight response
  /health:
    get:
      operationId: getHealth
      summary: The database answers and is at least as new as this code (ADR 0022)
      description: For smoke tests and monitors. Discloses no versions or configuration.
      security: []
      responses:
        "200":
          description: Compatible
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [ok] }
        "503":
          description: The database is older than this code (status schema-behind) or unavailable
          content:
            application/json:
              schema: { type: object }
  /me/membership:
    get:
      tags: [Membership]
      summary: The signed-in visitor's own membership (ADR 0019)
      description: |
        For the public website's sign-in page. The visitor's Supabase Auth
        access token goes in the Authorization header (never a URL, never a
        cookie); Supabase Auth verifies it and the answer is about that
        identity only. An application is linked only to a confirmed email.
        Signing in grants nothing: `member` is null until reviewers approved
        the application and it was activated. No note, reviewer, student ID or
        document is returned.
      security: [{ memberSession: [] }]
      responses:
        "200":
          description: The visitor's membership and latest application
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [emailConfirmed, member, application]
                    properties:
                      emailConfirmed: { type: boolean }
                      member:
                        type: [object, "null"]
                        required: [status, since]
                        properties:
                          status: { type: string, enum: [member, graduate] }
                          since: { type: string, format: date-time }
                      application:
                        type: [object, "null"]
                        required: [status, submittedAt, decidedAt, activated]
                        properties:
                          status:
                            type: string
                            enum: [pending_review, verified, approved, rejected]
                          submittedAt: { type: string, format: date-time }
                          decidedAt:
                            { type: [string, "null"], format: date-time }
                          activated: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    options:
      tags: [Membership]
      summary: CORS preflight (allows GET with Authorization)
      responses:
        "204":
          description: Preflight response
  /me/profile:
    get:
      operationId: getOwnProfile
      summary: Read the confirmed member's own profile (ADR 0023)
      description: |
        Name, emails, student ID, academic details, interests, photo state,
        membership activity and recent correction requests, with the profile
        features Core currently allows. Since ADR 0025 it also carries the
        category, institution and whether the member is SQU-verified. Private
        and never cached. A confirmed sign-in email that differs from the
        membership email and belongs to no other member is followed here,
        audited as member.email_synced.
      security: [{ memberSession: [] }]
      responses:
        "200":
          description: Private, no-store profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OwnProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateOwnProfile
      summary: Save the member's self-service fields
      description: |
        `{phone}` alone is the event-registration prompt (ADR 0020) and is
        always accepted. Otherwise all the self-service fields of one of the
        two shapes are required, and only while MEMBER_PROFILE_EDITING is not
        `disabled` (403 EDITING_DISABLED). The ADR 0025 shape adds the
        category, institution and institutionName under the registration
        rules; the four-field shape is the previous website's. Name, email and student ID are never accepted:
        they change through POST /me/profile/changes.
      security: [{ memberSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [phone]
                  properties:
                    phone:
                      type: string
                      maxLength: 32
                      description: International phone with country code; normalized to E.164.
                - type: object
                  additionalProperties: false
                  required: [phone, academicYear, discipline, interests]
                  properties:
                    phone:
                      type: [string, "null"]
                      maxLength: 32
                      description: Empty or null clears it.
                    academicYear: { type: integer, minimum: 1, maximum: 5 }
                    discipline:
                      type: string
                      enum:
                        [
                          mechanical,
                          electrical,
                          civil,
                          petroleum,
                          chemical,
                          mechatronics,
                          industrial,
                        ]
                    interests:
                      type: array
                      maxItems: 4
                      uniqueItems: true
                      items: { type: string }
                - type: object
                  additionalProperties: false
                  required:
                    [
                      phone,
                      category,
                      institution,
                      institutionName,
                      academicYear,
                      discipline,
                      interests,
                    ]
                  properties:
                    phone: { type: [string, "null"], maxLength: 32 }
                    category: { type: string }
                    institution:
                      type: string
                      description: A listed institution id, "other", or empty.
                    institutionName: { type: string, maxLength: 120 }
                    academicYear:
                      type: [integer, "null"]
                      minimum: 1
                      maximum: 5
                    discipline: { type: string }
                    interests:
                      type: array
                      maxItems: 4
                      uniqueItems: true
                      items: { type: string }
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/OwnProfile"
                      - $ref: "#/components/schemas/MemberProfile"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Invalid field; RFC 9457 errors with VALIDATION_ERROR and the field, or PHONE_REQUIRED.
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/profile/photo:
    get:
      operationId: getOwnPhoto
      summary: The member's own photo, re-encoded by Core
      security: [{ memberSession: [] }]
      responses:
        "200":
          description: Private, no-store 512×512 JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: putOwnPhoto
      summary: Replace the member's photo
      description: |
        The raw bytes of a JPEG or PNG of at most 3 MiB. Core checks the
        signature, strips metadata, crops it to a 512×512 JPEG and stores it in
        the private SUPABASE_S3_MEMBER_PHOTO_BUCKET; the replaced object is
        deleted. Refused with 403 UPLOADS_DISABLED while MEMBER_PHOTO_UPLOADS
        is `disabled`.
      security: [{ memberSession: [] }]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [code, photoVersion]
                    properties:
                      code: { const: SUCCESS }
                      photoVersion: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: Larger than 3 MiB. }
        "415": { description: Not image/jpeg or image/png. }
        "422": { description: Not a readable JPEG or PNG. }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteOwnPhoto
      summary: Remove the member's photo (always allowed)
      security: [{ memberSession: [] }]
      responses:
        "200": { description: Removed, or there was none }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    options:
      summary: CORS preflight (GET, PUT, DELETE with Authorization)
      responses:
        "204": { description: Preflight response }
  /me/profile/changes:
    post:
      operationId: requestProfileCorrection
      summary: Ask a membership reviewer to correct a verified field
      description: |
        Name and student ID were checked against the SQU ID card, so the
        member cannot change them. A reviewer (Society Affairs, Board or
        Technical, never the member themself) approves or rejects the request
        in the dashboard. One pending request per field.
      security: [{ memberSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [field, value]
              properties:
                field: { type: string, enum: [full_name, university_id] }
                value:
                  type: string
                  maxLength: 200
                  description: A name, or a student ID of 6–10 digits.
      responses:
        "201":
          description: Requested; the profile with the pending request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OwnProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: errors code UNCHANGED (already the current value) or ALREADY_PENDING.
        "422": { description: VALIDATION_ERROR }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/verification:
    get:
      operationId: getOwnSquVerification
      summary: The member's SQU student verification (ADR 0025)
      description: |
        The SQU state only (the number masked to its last three digits).
        Committee leadership is a separate endpoint, so either can fail
        without hiding the other. Never a reviewer note, reviewer identity or
        document key. Private and never cached.
      security: [{ memberSession: [] }]
      responses:
        "200":
          description: Private, no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OwnSquVerification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    options:
      summary: CORS preflight (GET with Authorization)
      responses:
        "204": { description: Preflight response }
  /me/leadership:
    get:
      operationId: getOwnLeadership
      summary: The member's committee appointments, requests and limits (ADR 0025)
      description: |
        Appointments and requests with the member-facing reasons, the request
        limit (requests the structure cancelled do not count) and whether a
        dashboard grant exists, reported only. Never a reviewer note or
        reviewer identity. Private and never cached.
      security: [{ memberSession: [] }]
      responses:
        "200":
          description: Private, no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OwnLeadership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    options:
      summary: CORS preflight (GET with Authorization)
      responses:
        "204": { description: Preflight response }
  /me/verification/squ:
    post:
      operationId: submitSquVerification
      summary: Submit SQU student verification evidence
      description: |
        Optional, and independent of membership. One pending request at a
        time, none while verified, and at most the configured number of
        submissions in 30 days (default 3). A membership reviewer decides; the
        evidence is stored privately and never reachable by URL.
      security: [{ memberSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [studentNumber, document]
              properties:
                studentNumber: { type: string, pattern: "^[0-9]{6,10}$" }
                document:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP or PDF of the SQU student ID card, at most 4 MiB.
      responses:
        "201":
          description: Submitted; the member's updated roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OwnSquVerification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: errors code ALREADY_PENDING or ALREADY_VERIFIED.
        "413": { description: Larger than the body limit. }
        "422":
          description: studentNumber or document invalid (required, invalid, too-large, unsupported-type, unexpected-field).
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    options:
      summary: CORS preflight (POST with Authorization)
      responses:
        "204": { description: Preflight response }
  /me/leadership/options:
    get:
      operationId: getLeadershipOptions
      summary: Every active committee with its active teams (possibly none), the positions, and whether requests are open
      security: [{ memberSession: [] }]
      responses:
        "200":
          description: Private, no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code: { const: SUCCESS }
                      requestsOpen:
                        type: boolean
                        description: ADR 0026. False while Board Administration or Technical have closed new requests.
                      committees:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            teams:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: string, format: uuid }
                                  name:
                                    { $ref: "#/components/schemas/TeamName" }
                      positions:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            label: { $ref: "#/components/schemas/Localized" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    options:
      summary: CORS preflight (GET with Authorization)
      responses:
        "204": { description: Preflight response }
  /me/leadership/requests:
    post:
      operationId: requestLeadership
      summary: Request a Chief or Assistant Chief position for a committee, or for one of its teams
      description: |
        Without a team (teamId null or absent) the request is committee
        leadership; with one, team leadership (ADR 0026). The database
        re-checks that requests are open and the committee → (team) →
        position path. A request grants nothing until a leadership reviewer
        approves it; an appointment then gives only the dashboard permissions
        assigned to its committee or team (ADR 0027).
      security: [{ memberSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [committeeId, position]
              properties:
                committeeId: { type: string, format: uuid }
                teamId:
                  type: [string, "null"]
                  format: uuid
                  description: Null or absent for committee leadership.
                position: { type: string, enum: [chief, assistant_chief] }
      responses:
        "201":
          description: Requested; the member's updated roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OwnLeadership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: errors code REQUESTS_CLOSED, ALREADY_PENDING, ALREADY_APPOINTED, TEAM_INACTIVE or COMMITTEE_ARCHIVED.
        "422":
          description: VALIDATION_ERROR or HIERARCHY_MISMATCH (the team is not in that committee).
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    options:
      summary: CORS preflight (POST with Authorization)
      responses:
        "204": { description: Preflight response }
  /me/email-preferences:
    get:
      operationId: getOwnEmailPreferences
      summary: The member's choice about the society's optional email announcements
      description: ADR 0028. No stored choice means subscribed.
      security: [{ memberSession: [] }]
      responses:
        "200":
          description: The stored choice
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code: { const: SUCCESS }
                      announcements: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: setOwnEmailPreferences
      summary: Turn the society's optional email announcements on or off
      description: Audited (email.preferences_changed). Unsubscribe links in Email Centre messages change the same setting.
      security: [{ memberSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [announcements]
              properties:
                announcements: { type: boolean }
      responses:
        "200":
          description: The stored choice
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code: { const: SUCCESS }
                      announcements: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: VALIDATION_ERROR (field announcements).
        "503": { $ref: "#/components/responses/Unavailable" }
    options:
      summary: CORS preflight (GET or PATCH with Authorization)
      responses:
        "204": { description: Preflight response }
  /me/events:
    get:
      operationId: listOwnRegistrations
      summary: The member's own registrations, newest event first
      description: Guest registrations made with the member's confirmed email are linked first (ADR 0022).
      security: [{ memberSession: [] }]
      responses:
        "200":
          description: Private, no-store list of at most 100
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [code, registrations]
                    properties:
                      code: { const: SUCCESS }
                      registrations:
                        type: array
                        items:
                          type: object
                          properties:
                            eventId: { type: string, format: uuid }
                            title: { type: string }
                            eventDate: { type: string, format: date-time }
                            location: { type: [string, "null"] }
                            status:
                              { type: string, enum: [confirmed, waitlisted] }
                            attended: { type: boolean }
                            checkedInAt:
                              { type: [string, "null"], format: date-time }
                            method:
                              {
                                type: [string, "null"],
                                enum: [qr, manual, null],
                              }
                            registeredAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/events/{eventId}/registrations:
    parameters:
      - {
          name: eventId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: registerOwnProfile
      summary: Register with Core's verified profile and canonical seat/waitlist rules
      security: [{ memberSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intent]
              properties:
                intent: { type: string, enum: [register, join_waitlist] }
      responses:
        "201":
          description: Registration accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [confirmed, waitlisted] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Existing registration conflict reasons apply. }
        "422": { description: Invalid fields or required profile phone. }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/events/{eventId}/attendance:
    parameters:
      - {
          name: eventId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: getOwnAttendance
      summary: Read own event eligibility; never records attendance
      security: [{ memberSession: [] }]
      responses:
        "200":
          description: Private eligibility and attendance state; no challenge is exposed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code: { const: SUCCESS }
                      profile: { $ref: "#/components/schemas/MemberProfile" }
                      registration:
                        type: [object, "null"]
                        properties:
                          status:
                            { type: string, enum: [confirmed, waitlisted] }
                          attended: { type: boolean }
                          checkedInAt:
                            { type: [string, "null"], format: date-time }
                      checkinOpen: { type: boolean }
                      closesAt: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: confirmOwnAttendance
      summary: Explicit idempotent check-in with an unexpired event challenge
      security: [{ memberSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge]
              properties:
                challenge: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: Recorded attendance or original result of an idempotent retry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code: { const: SUCCESS }
                      checkedInAt: { type: string, format: date-time }
                      alreadyAttended: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          {
            description: "RFC 9457 errors code NOT_REGISTERED, WAITLISTED, CHECKIN_CLOSED, CHALLENGE_EXPIRED or INVALID_CHALLENGE.",
          }
        "503": { $ref: "#/components/responses/Unavailable" }
  /events/{eventId}/image:
    parameters:
      - {
          name: eventId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: getEventCover
      summary: Sanitized cover image of a currently public event
      security: []
      responses:
        "200":
          description: JPEG or PNG; no private Storage URL or credentials
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { description: No public event or cover. }
        "503": { description: Storage or database unavailable. }
components:
  securitySchemes:
    memberSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Supabase Auth access token from the visitor's own sign-in in the
        browser. Not an API client key; it identifies a person, not a server.
    clientKey:
      type: http
      scheme: bearer
      description: |
        A scoped API client token, provisioned by Core. Never expose it in
        browser JavaScript, a public environment variable, or client-side
        rendering. If a token may have leaked, revoke it and rotate.
  headers:
    RequestId:
      description: Correlation id, echoed from a valid caller value or generated.
      schema: { type: string }
  schemas:
    Localized:
      type: object
      required: [en, ar]
      properties:
        en: { type: string }
        ar: { type: string }
    TeamName:
      type: object
      required: [en, ar]
      properties:
        en: { type: string }
        ar: { type: [string, "null"] }
    RolePath:
      type: object
      properties:
        committee:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            archived: { type: boolean }
        level:
          type: string
          enum: [committee, team]
          description: ADR 0026. Committee leadership has no team.
        team:
          type: [object, "null"]
          description: Null for committee leadership.
          properties:
            id: { type: string, format: uuid }
            name: { $ref: "#/components/schemas/TeamName" }
            status: { type: string, enum: [active, inactive, archived] }
        position:
          type: object
          properties:
            id: { type: string }
            label: { $ref: "#/components/schemas/Localized" }
    OwnSquVerification:
      type: object
      description: ADR 0025. SQU student verification only; it changes nothing about membership.
      properties:
        code: { const: SUCCESS }
        status:
          type: string
          enum: [not_verified, pending, verified, rejected, revoked]
        studentNumber:
          type: [string, "null"]
          description: Masked to the last three digits.
        submittedAt: { type: [string, "null"], format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
        verifiedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
        revokedAt: { type: [string, "null"], format: date-time }
        revocationReason: { type: [string, "null"] }
        submissionsPer30Days: { type: integer }
        recentSubmissions: { type: integer }
        canSubmit: { type: boolean }
        nextSubmissionAt: { type: [string, "null"], format: date-time }
    OwnLeadership:
      type: object
      description: ADRs 0025 and 0026. Committee- and team-level appointments and requests; none of them grants dashboard access.
      properties:
        code: { const: SUCCESS }
        requestsOpen:
          type: boolean
          description: Whether new requests are accepted; appointments and requests are listed either way.
        appointments:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/RolePath"
              - type: object
                properties:
                  id: { type: string, format: uuid }
                  active: { type: boolean }
                  appointedAt: { type: string, format: date-time }
                  endedAt: { type: [string, "null"], format: date-time }
                  endReason: { type: [string, "null"] }
        requests:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/RolePath"
              - type: object
                properties:
                  id: { type: string, format: uuid }
                  status:
                    type: string
                    enum: [pending, approved, rejected, cancelled]
                  submittedAt: { type: string, format: date-time }
                  decidedAt: { type: [string, "null"], format: date-time }
                  rejectionReason: { type: [string, "null"] }
                  cancellationReason:
                    type: [string, "null"]
                    enum:
                      [
                        team_moved,
                        team_inactive,
                        team_archived,
                        committee_archived,
                        null,
                      ]
        limits:
          type: object
          properties:
            requestsPer30Days: { type: integer }
            recentRequests:
              type: integer
              description: Requests in the last 30 days, not counting those the structure cancelled.
            maxActiveAppointments: { type: [integer, "null"] }
            activeAppointments: { type: integer }
        dashboardAccess:
          type: boolean
          description: Whether the member holds any dashboard permission (a personal level, or a position whose committee or team has permissions, ADR 0027). Reported only.
    MemberProfile:
      type: object
      additionalProperties: false
      required: [code, name, email, phone]
      properties:
        code: { const: SUCCESS }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, "null"], description: Private E.164 phone. }
    OwnProfile:
      type: object
      required:
        [
          code,
          name,
          email,
          universityId,
          phone,
          hasPhoto,
          status,
          interests,
          changeRequests,
        ]
      properties:
        code: { const: SUCCESS }
        name: { type: string }
        email:
          type: string
          format: email
          description: The email the membership keeps.
        signInEmail:
          type: [string, "null"]
          format: email
          description: The Supabase Auth sign-in email.
        universityId:
          type: [string, "null"]
          description: Null for members admitted after ADR 0025.
        category:
          type: [string, "null"]
          description: Null for a legacy member whose category was not recorded.
        categoryLabel:
          oneOf:
            - $ref: "#/components/schemas/Localized"
            - type: "null"
        institution:
          type: [object, "null"]
          properties:
            id: { type: string }
            name: { $ref: "#/components/schemas/Localized" }
        institutionName:
          type: [string, "null"]
          description: A university typed by the member ("Other university").
        squVerified: { type: boolean }
        academicYear: { type: [integer, "null"], minimum: 1, maximum: 5 }
        discipline: { type: [string, "null"] }
        interests: { type: array, items: { type: string }, maxItems: 4 }
        phone: { type: [string, "null"], description: Private E.164 phone. }
        hasPhoto: { type: boolean }
        photoVersion: { type: [string, "null"] }
        status: { type: string, enum: [member, graduate] }
        memberSince: { type: string, format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        application:
          type: [object, "null"]
          properties:
            status: { type: string }
            submittedAt: { type: string, format: date-time }
            verifiedAt: { type: [string, "null"], format: date-time }
            decidedAt: { type: [string, "null"], format: date-time }
            activatedAt: { type: [string, "null"], format: date-time }
        changeRequests:
          type: array
          description: Pending requests, and decisions of the last 30 days.
          items:
            type: object
            properties:
              field: { type: string, enum: [full_name, university_id] }
              status: { type: string, enum: [pending, approved, rejected] }
              requestedValue: { type: string }
              requestedAt: { type: string, format: date-time }
              decidedAt: { type: [string, "null"], format: date-time }
        features:
          type: object
          description: Core's own switches (MEMBER_PROFILE_EDITING, MEMBER_PHOTO_UPLOADS). Core enforces them whatever a client shows.
          properties:
            profileEditing: { type: boolean }
            photoUploads: { type: boolean }
    Event:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          description,
          eventDate,
          location,
          committeeName,
          availability,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        eventDate:
          type: string
          format: date-time
          description: ISO 8601 with offset.
        location:
          type: [string, "null"]
        committeeName: { type: string }
        availability:
          type: string
          enum: [open, waitlist, closed]
          description: Derived by Core. Do not infer from anything else.
          coverImageUrl:
            type: [string, "null"]
            description: Public image route relative to the Core origin, including its version query. Null without a cover.
          phoneRequired:
            type: boolean
            default: false
    EventList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        meta:
          type: object
          required: [nextCursor]
          properties:
            nextCursor:
              type: [string, "null"]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable public error code. Never derived from an internal one.
          enum:
            - bad-request
            - unsupported-media-type
            - payload-too-large
            - invalid-fields
            - unauthorized
            - forbidden
            - not-found
            - conflict
            - rate-limited
            - service-unavailable
        requestId: { type: string }
        reason:
          type: string
          description: Optional conflict detail, present only with code conflict (409). Registration uses the first five; membership applications the last two. Unknown or absent reasons must use generic conflict handling.
          enum:
            - already-registered
            - already-waitlisted
            - event-full
            - registration-closed
            - registration-available
            - already-applied
            - already-member
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, malformed, unknown, wrong-hash, inactive, revoked, expired or wrong-environment credential.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The registration origin is not allowed, or a valid active read credential lacks events:read.
      content:
        application/problem+json:
